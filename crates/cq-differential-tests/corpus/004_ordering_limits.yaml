# ORDER BY (ASC/DESC), LIMIT, OFFSET. Catches sort-stability behaviour
# on equal keys, ASC-default semantics, and pagination edge cases
# (LIMIT 0, LIMIT > N, OFFSET > N).
#
# Projections include the key column to dodge the tombstone-filter
# bug (see Known Issues).
- name: order_by_asc_default
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 30 }
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
  query: "SELECT id, v FROM t ORDER BY v"
  expected_rows:
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
    - { id: 1, v: 30 }

- name: order_by_explicit_asc
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 30 }
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
  query: "SELECT id, v FROM t ORDER BY v ASC"
  expected_rows:
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
    - { id: 1, v: 30 }

- name: order_by_desc
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 30 }
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
  query: "SELECT id, v FROM t ORDER BY v DESC"
  expected_rows:
    - { id: 1, v: 30 }
    - { id: 3, v: 20 }
    - { id: 2, v: 10 }

- name: order_by_limit_2
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 30 }
    - { id: 2, v: 10 }
    - { id: 3, v: 20 }
    - { id: 4, v: 40 }
  query: "SELECT id, v FROM t ORDER BY v DESC LIMIT 2"
  expected_rows:
    - { id: 4, v: 40 }
    - { id: 1, v: 30 }

- name: limit_zero_returns_empty
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 10 }
    - { id: 2, v: 20 }
  query: "SELECT id, v FROM t ORDER BY v LIMIT 0"
  expected_rows: []

- name: limit_larger_than_population
  schema:
    - { name: id, type: long }
    - { name: v, type: long }
  key: id
  publishes:
    - { id: 1, v: 10 }
    - { id: 2, v: 20 }
  query: "SELECT id, v FROM t ORDER BY v LIMIT 100"
  expected_rows:
    - { id: 1, v: 10 }
    - { id: 2, v: 20 }
