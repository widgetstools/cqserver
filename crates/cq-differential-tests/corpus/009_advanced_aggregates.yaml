# Advanced aggregates added in P8/P9/P10 — STDDEV variants, VARIANCE
# variants, COUNT(DISTINCT), MEDIAN, PERCENTILE_CONT. The point is to
# pin CQ's statistical semantics against a reference engine so future
# changes to either (numerical-stability rewrites, type-coercion
# tweaks) surface immediately.
#
# Note on naming: CQ treats `STDDEV` and `VARIANCE` as POPULATION
# (matches kdb / q tradition), whereas DataFusion treats them as
# SAMPLE (matches ANSI). We avoid the ambiguous names in this corpus
# and always use the explicit `*_POP` / `*_SAMP` forms so both engines
# agree without an `expect_divergence` annotation.
#
# PERCENTILE_CONT is also a divergence: CQ uses positional args
# `PERCENTILE_CONT(col, q)` while DataFusion uses the SQL standard
# `PERCENTILE_CONT(q) WITHIN GROUP (ORDER BY col)`. We declare those
# as `expected_rows`-only — the harness falls back to a CQ-vs-expected
# check when DataFusion can't plan the query.

- name: stddev_pop_basic
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 2.0 }
    - { id: 2, v: 4.0 }
    - { id: 3, v: 4.0 }
    - { id: 4, v: 4.0 }
    - { id: 5, v: 5.0 }
    - { id: 6, v: 5.0 }
    - { id: 7, v: 7.0 }
    - { id: 8, v: 9.0 }
  query: "SELECT STDDEV_POP(v) AS s FROM t"
  expected_rows:
    - { s: 2.0 }
  notes: |
    Textbook population stddev example. Mean = 5, M2 = 32,
    sqrt(32/8) = 2.0 exactly.

- name: stddev_samp_basic
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 2.0 }
    - { id: 2, v: 4.0 }
    - { id: 3, v: 4.0 }
    - { id: 4, v: 4.0 }
    - { id: 5, v: 5.0 }
    - { id: 6, v: 5.0 }
    - { id: 7, v: 7.0 }
    - { id: 8, v: 9.0 }
  query: "SELECT STDDEV_SAMP(v) AS s FROM t"
  # sqrt(32/7) ≈ 2.138089935299395 — left out of expected_rows so we
  # rely on cross-engine agreement (no risk of float-format drift).

- name: var_pop_basic
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 2.0 }
    - { id: 2, v: 4.0 }
    - { id: 3, v: 4.0 }
    - { id: 4, v: 4.0 }
    - { id: 5, v: 5.0 }
    - { id: 6, v: 5.0 }
    - { id: 7, v: 7.0 }
    - { id: 8, v: 9.0 }
  query: "SELECT VAR_POP(v) AS vp FROM t"
  expected_rows:
    - { vp: 4.0 }
  notes: |
    Same fixture as stddev — VAR_POP = M2 / N = 32 / 8 = 4.

- name: var_samp_basic
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 2.0 }
    - { id: 2, v: 4.0 }
    - { id: 3, v: 4.0 }
    - { id: 4, v: 4.0 }
    - { id: 5, v: 5.0 }
    - { id: 6, v: 5.0 }
    - { id: 7, v: 7.0 }
    - { id: 8, v: 9.0 }
  query: "SELECT VAR_SAMP(v) AS vs FROM t"
  # M2 / (N-1) = 32 / 7 — no exact decimal, leave to cross-engine check.

- name: stddev_pop_single_row
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 42.0 }
  query: "SELECT STDDEV_POP(v) AS s FROM t"
  expected_rows:
    - { s: 0.0 }
  notes: |
    N=1: population stddev is 0 by definition (deviation from itself).

- name: count_distinct_string
  schema:
    - { name: id, type: long }
    - { name: tag, type: string }
  key: id
  publishes:
    - { id: 1, tag: "a" }
    - { id: 2, tag: "b" }
    - { id: 3, tag: "a" }
    - { id: 4, tag: "c" }
    - { id: 5, tag: "b" }
    - { id: 6, tag: "a" }
  query: "SELECT COUNT(DISTINCT tag) AS c FROM t"
  expected_rows:
    - { c: 3 }

- name: count_distinct_int
  schema:
    - { name: id, type: long }
    - { name: bucket, type: long }
  key: id
  publishes:
    - { id: 1, bucket: 10 }
    - { id: 2, bucket: 20 }
    - { id: 3, bucket: 10 }
    - { id: 4, bucket: 30 }
    - { id: 5, bucket: 20 }
  query: "SELECT COUNT(DISTINCT bucket) AS c FROM t"
  expected_rows:
    - { c: 3 }

- name: count_distinct_with_null
  schema:
    - { name: id, type: long }
    - { name: tag, type: string }
  key: id
  publishes:
    - { id: 1, tag: "a" }
    - { id: 2, tag: null }
    - { id: 3, tag: "b" }
    - { id: 4, tag: null }
    - { id: 5, tag: "a" }
  query: "SELECT COUNT(DISTINCT tag) AS c FROM t"
  expected_rows:
    - { c: 2 }
  notes: |
    ANSI: COUNT(DISTINCT) ignores NULLs. Expect 2 (a, b).

- name: count_distinct_group_by
  schema:
    - { name: id, type: long }
    - { name: desk, type: string }
    - { name: trader, type: string }
  key: id
  publishes:
    - { id: 1, desk: "RATES", trader: "alice" }
    - { id: 2, desk: "RATES", trader: "bob" }
    - { id: 3, desk: "RATES", trader: "alice" }
    - { id: 4, desk: "FX",    trader: "carol" }
    - { id: 5, desk: "FX",    trader: "carol" }
  query: "SELECT desk, COUNT(DISTINCT trader) AS traders FROM t GROUP BY desk"
  expected_rows:
    - { desk: "RATES", traders: 2 }
    - { desk: "FX",    traders: 1 }

# ─── PERCENTILE_CONT / MEDIAN ──────────────────────────────────────
# DataFusion won't plan CQ's positional `PERCENTILE_CONT(col, q)` —
# the harness falls back to `expected_rows`-only verification when DF
# emits a planning error.

- name: percentile_cont_50
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 10.0 }
    - { id: 2, v: 20.0 }
    - { id: 3, v: 30.0 }
    - { id: 4, v: 40.0 }
    - { id: 5, v: 50.0 }
  query: "SELECT PERCENTILE_CONT(v, 0.5) AS p50 FROM t"
  expected_rows:
    - { p50: 30.0 }
  notes: |
    Linear-interpolation p50 of {10,20,30,40,50} is 30.

- name: percentile_cont_25
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 10.0 }
    - { id: 2, v: 20.0 }
    - { id: 3, v: 30.0 }
    - { id: 4, v: 40.0 }
    - { id: 5, v: 50.0 }
  query: "SELECT PERCENTILE_CONT(v, 0.25) AS p25 FROM t"
  expected_rows:
    - { p25: 20.0 }
  notes: |
    p=0.25 of N=5 → index 1.0 (0-based) → exactly the 2nd element = 20.

- name: percentile_cont_95
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 1.0 }
    - { id: 2, v: 2.0 }
    - { id: 3, v: 3.0 }
    - { id: 4, v: 4.0 }
    - { id: 5, v: 5.0 }
    - { id: 6, v: 6.0 }
    - { id: 7, v: 7.0 }
    - { id: 8, v: 8.0 }
    - { id: 9, v: 9.0 }
    - { id: 10, v: 10.0 }
    - { id: 11, v: 11.0 }
    - { id: 12, v: 12.0 }
    - { id: 13, v: 13.0 }
    - { id: 14, v: 14.0 }
    - { id: 15, v: 15.0 }
    - { id: 16, v: 16.0 }
    - { id: 17, v: 17.0 }
    - { id: 18, v: 18.0 }
    - { id: 19, v: 19.0 }
    - { id: 20, v: 20.0 }
    - { id: 21, v: 21.0 }
  query: "SELECT PERCENTILE_CONT(v, 0.95) AS p95 FROM t"
  expected_rows:
    - { p95: 20.0 }
  notes: |
    N=21, p=0.95 → exact index 19 (0-based) → v=20.

- name: median_basic
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 10.0 }
    - { id: 2, v: 20.0 }
    - { id: 3, v: 30.0 }
  query: "SELECT MEDIAN(v) AS m FROM t"
  expected_rows:
    - { m: 20.0 }
  notes: |
    MEDIAN = PERCENTILE_CONT(col, 0.5). DataFusion's median() exists
    too — both should agree on 20.

- name: median_even_count_interpolates
  schema:
    - { name: id, type: long }
    - { name: v, type: double }
  key: id
  publishes:
    - { id: 1, v: 10.0 }
    - { id: 2, v: 20.0 }
    - { id: 3, v: 30.0 }
    - { id: 4, v: 40.0 }
  query: "SELECT MEDIAN(v) AS m FROM t"
  expected_rows:
    - { m: 25.0 }
  notes: |
    Linear-interpolation median of even-N sample is the average of the
    middle two: (20+40)/2 = 25 — wait, no: (20+30)/2 = 25.
    DataFusion's MEDIAN may differ on even N (some engines pick
    nearest-rank instead). The harness's DF fallback applies if so.
