[package]
name = "cq-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cq-protocol = { path = "../cq-protocol" }
cq-core = { path = "../cq-core" }
cq-txlog = { path = "../cq-txlog" }
sqlparser.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
dashmap.workspace = true
uuid.workspace = true
crossbeam-channel.workspace = true
metrics.workspace = true
bcrypt.workspace = true
rmp-serde.workspace = true
parking_lot.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
jsonwebtoken.workspace = true

# H3 (measurement): zstd-compute compressed size of each cached
# snapshot so operators can see what WS-level deflate would buy.
# Actual wire compression on Rust 1.78 requires switching the WS
# library — verified that tokio-tungstenite 0.24-0.29 and
# tokio-websockets 0.8.x have no deflate support. This gauge lets
# us decide whether the lib swap is worth pursuing.
zstd.workspace = true

[dev-dependencies]
compact_str.workspace = true
tempfile.workspace = true
parking_lot.workspace = true
# Task 2.4 finding #3 — capture tracing output in-process to assert the
# `unauth_command` cq_audit event fires on the reject branch of dispatch().
tracing-subscriber.workspace = true
# Self-signed certs for TLS-handshake-timeout unit tests (tcp.rs).
# Same version/features cq-e2e-tests already uses for its TLS harness.
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
