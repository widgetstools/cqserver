[package]
name = "cq-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cq-loadgen"
path = "src/main.rs"

[dependencies]
cq-client = { path = "../cq-client" }
# B2.1 — raw-socket slow subscriber (backpressure/drop path) reuses the
# wire codec + message types directly instead of hand-rolling frame bytes.
cq-protocol = { path = "../cq-protocol" }
bytes.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# CLI parsing
clap = { workspace = true }

# HDR histograms for accurate p50/p95/p99/p99.9 latency reporting
hdrhistogram = { workspace = true }

tracing.workspace = true
tracing-subscriber.workspace = true

# Used by stress-2k for join_all + parallel task join with a single
# timeout (replaces a serial join loop that could hang for hours).
futures = "0.3"

# Scenario I — admin add-column round-trip needs HTTP + URL encoding.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"

[dev-dependencies]
