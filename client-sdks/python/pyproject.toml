[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cqclient"
version = "0.1.0"
description = "Async Python client SDK for cqserver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["cqclient"]
