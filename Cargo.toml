[workspace]
resolver = "2"
members = [
    "crates/cq-client",
    "crates/cq-core",
    "crates/cq-e2e-tests",
    "crates/cq-protocol",
    "crates/cq-replication",
    "crates/cq-transport",
    "crates/cq-txlog",
    "crates/cq-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQL parsing
sqlparser = "0.56"

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# TCP framing
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# TLS — server transport wraps the raw TcpStream when [transport.tls]
# is configured, and cq-client opts in via `with_tls()`.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Data structures
roaring = "0.10"
compact_str = { version = "0.8", features = ["serde"] }
ahash = "0.8"

# Config
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Admin HTTP API
axum = "0.7"

# Auth
bcrypt = "0.16"

# Binary serialization (MessagePack)
rmp-serde = "1.3"

# BSON codec (MongoDB-style binary JSON)
bson = "2"

# Utils
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6"
regex = "1"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Checksums
crc32fast = "1.4"

# Compression — zstd for sealed txlog segments + per-connection
# wire compression. `pure` keeps it a single-binary crate so we
# don't pull in a C dep.
zstd = { version = "0.13", default-features = false }

# Temp dirs for tests
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
