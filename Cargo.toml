[workspace]
resolver = "2"
members = [
    "crates/cq-client",
    "crates/cq-core",
    "crates/cq-e2e-tests",
    "crates/cq-loadgen",
    "crates/cq-protocol",
    "crates/cq-replication",
    "crates/cq-transport",
    "crates/cq-txlog",
    "crates/cq-server",
]
# `cq-differential-tests` is intentionally excluded from the
# default workspace: DataFusion + Arrow's transitive deps now require
# edition = "2024" in their Cargo manifests, which cargo < 1.85 cannot
# parse. The dev harness can still be built/tested in isolation:
#   `cd crates/cq-differential-tests && cargo test`
# (using a newer Rust toolchain).
exclude = ["crates/cq-differential-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQL parsing
sqlparser = "0.56"

# Q10 — base64 encode/decode for the `bytes` column type's JSON
# wire format.
base64 = "0.22"

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# TCP framing
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# TLS — server transport wraps the raw TcpStream when [transport.tls]
# is configured, and cq-client opts in via `with_tls()`.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Data structures
roaring = "0.10"
compact_str = { version = "0.8", features = ["serde"] }
ahash = "0.8"

# Config
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Admin HTTP API
axum = "0.7"

# Auth
bcrypt = "0.16"

# Binary serialization (MessagePack)
rmp-serde = "1.3"

# BSON codec (MongoDB-style binary JSON)
bson = "2"

# Utils
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6"
regex = "1"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# Concurrency model checker (loom). Pulled in only under `--cfg loom`
# via per-crate `[target.'cfg(loom)'.dependencies]`, plus dev-deps so
# loom-cfg-gated test files compile cleanly without RUSTFLAGS.
loom = "0.7"

# Property-based testing
proptest = "1"

# DataFusion is the reference SQL engine for `cq-differential-tests`
# (see .github/workflows/ci.yml). Pure Rust (no C/C++ toolchain
# needed), modern analytical SQL surface, and Arrow-native. The crate
# only links into `crates/cq-differential-tests`.
# DataFusion + Arrow are only used by `crates/cq-differential-tests/`,
# which is excluded from the default workspace (it requires cargo 1.85+
# for edition = "2024" transitives). The version below is what the
# diff-tests crate uses when built standalone.
# datafusion = { version = "42", default-features = false, features = ["crypto_expressions", "regex_expressions", "unicode_expressions"] }
# arrow = "53"

# YAML parser for the differential-tests corpus.
serde_yaml = "0.9"

# CLI argument parsing for cq-loadgen
clap = { version = "4", features = ["derive"] }

# HDR histograms for accurate latency percentiles (cq-loadgen)
hdrhistogram = "7"

# Checksums
crc32fast = "1.4"

# Compression — zstd for sealed txlog segments + per-connection
# wire compression. `pure` keeps it a single-binary crate so we
# don't pull in a C dep.
zstd = { version = "0.13", default-features = false }

# Temp dirs for tests
tempfile = "3"

# JWT validation for S16 auth.
jsonwebtoken = "9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
