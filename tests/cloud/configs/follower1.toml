# cqserver C0 — follower1 (role=standby; receives from leader)

tcp_addr       = "0.0.0.0:9007"
websocket_addr = "0.0.0.0:9008"
websocket_path = "/cq/json"
admin_addr     = "0.0.0.0:8085"

heartbeat_interval_s     = 60
heartbeat_idle_timeout_s = 600

[transport]
outbound_queue_capacity = 2048
sow_batch_size          = 200

[txlog]
directory = "/var/lib/cqserver/txlog"

[replication]
role   = "standby"
listen = "0.0.0.0:9010"

# Same topic + schema as the leader. Replication won't apply
# mutations for topics this server doesn't know about (the
# receiver logs "Replicated entry for unknown topic — skipping").
[[topics]]
name             = "/c0-orders"
key              = ["order_id"]
persist          = true
initial_capacity = 10000
columns          = [
  { name = "order_id", type = "string" },
  { name = "book",     type = "string" },
  { name = "qty",      type = "long"   },
  { name = "price",    type = "double" },
]
