# Prometheus scrape config for the B1 soak topology.
# Mounted read-only into the `prometheus` service at
# /etc/prometheus/prometheus.yml by docker-compose.soak.yml.

global:
  scrape_interval: 10s      # within the 5-15s band the soak brief asks for
  evaluation_interval: 10s

scrape_configs:
  - job_name: cqserver
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["cqserver:8085"]
        labels:
          service: cqserver
          topology: soak
