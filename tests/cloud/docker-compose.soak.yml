# Soak / scale topology — CLOUD_REPLICATION_TEST_WORKLOG Bucket B, task B1.
#
# Purpose: a long-running (multi-day) single-node cqserver under
# sustained load, with Prometheus scraping its /metrics the whole
# time, so B2 (load driver) and later analysis can watch memory/CPU/
# disk/latency trend over hours-to-days instead of the few-minute
# windows the C0 replication harness exercises.
#
# Topology:
#   cqserver     :8085 admin/metrics/ui   :9007 tcp   :9008 ws
#                persistent Atlas-shaped topics, checkpoint_interval_secs
#                set so the txlog stays disk-bounded across the whole soak
#   load-driver  no exposed ports; runs `cq-loadgen --scenario soak`
#                (Dockerfile.loadgen) against cqserver:9007/:8085 — seeds
#                wide /positions rows, then ticks delta_publish while
#                holding 3 subscriber classes (fast / conflated / slow)
#                open for the whole run (task B2). Overridable via the
#                SOAK_* env vars below or by overriding `command:`.
#   prometheus   :9090, scrapes cqserver:8085/metrics every 10s per
#                prometheus-soak.yml
#
# The compose network is `cq-soak` bridge. Hostnames `cqserver`,
# `load-driver`, `prometheus` resolve inside it.
#
# Usage: see tests/cloud/SOAK.md.

services:
  # Docker creates named volumes root-owned; Dockerfile.runtime's image
  # layer `chown -R cq:cq /var/lib/cqserver` is shadowed the moment the
  # named volume is mounted over it, so cqserver (running as the
  # unprivileged `cq` user) can't write its txlog on first boot. This
  # one-shot init container fixes ownership on the volume itself before
  # `cqserver` starts, then exits.
  txlog-perms-fix:
    container_name: cq-soak-txlog-perms-fix
    image: cqserver:local
    build:
      context: ../..
      dockerfile: tests/cloud/Dockerfile.runtime
    user: root
    entrypoint: ["/bin/sh", "-c", "chown -R cq:cq /var/lib/cqserver/txlog"]
    volumes:
      - cqserver-soak-txlog:/var/lib/cqserver/txlog
    networks:
      cq-soak: {}

  cqserver:
    container_name: cq-soak-server
    image: cqserver:local
    build:
      context: ../..
      dockerfile: tests/cloud/Dockerfile.runtime
    networks:
      cq-soak:
        aliases: [cqserver]
    ports:
      - "127.0.0.1:9007:9007"   # tcp transport
      - "127.0.0.1:9008:9008"   # ws transport
      - "127.0.0.1:8085:8085"   # admin + /metrics + /ui
    volumes:
      - ./configs/soak.toml:/etc/cqserver/cqserver.toml:ro
      - ../../config/schemas:/etc/cqserver/schemas:ro
      - cqserver-soak-txlog:/var/lib/cqserver/txlog
    depends_on:
      txlog-perms-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 20

  # B2 — the real soak load driver: cq-loadgen's `soak` scenario. Same
  # network as B1's placeholder so no topology changes were needed; only
  # `image`/`build`/`command` changed. SOAK_* env vars override the
  # workload shape without editing this file (e.g. `SOAK_DURATION_SECS=3600
  # docker compose -f docker-compose.soak.yml up load-driver`); `command:`
  # itself can also be overridden per the usual compose semantics.
  load-driver:
    container_name: cq-soak-load-driver
    image: cq-loadgen:local
    build:
      context: ../..
      dockerfile: tests/cloud/Dockerfile.loadgen
    networks:
      cq-soak: {}
    depends_on:
      cqserver:
        condition: service_healthy
    environment:
      SOAK_DURATION_SECS: "${SOAK_DURATION_SECS:-60}"
      SOAK_RATE: "${SOAK_RATE:-50}"
      SOAK_ROWS: "${SOAK_ROWS:-2000}"
      SOAK_COLS: "${SOAK_COLS:-60}"
      SOAK_FAST_SUBSCRIBERS: "${SOAK_FAST_SUBSCRIBERS:-2}"
      SOAK_CONFLATED_SUBSCRIBERS: "${SOAK_CONFLATED_SUBSCRIBERS:-2}"
      SOAK_SLOW_SUBSCRIBERS: "${SOAK_SLOW_SUBSCRIBERS:-1}"
      SOAK_SLOW_READ_DELAY_MS: "${SOAK_SLOW_READ_DELAY_MS:-300}"
      # B2.1 — "raw" (default) opens a bare TCP socket and stalls its
      # reads so it genuinely backpressures cqserver's outbound queue and
      # induces real slow-consumer drops; "sdk" uses cq-client like the
      # fast/conflated classes and is kept only for comparison (it can't
      # induce real drops — see scenarios.rs's `SlowMode` doc comment).
      SOAK_SLOW_MODE: "${SOAK_SLOW_MODE:-raw}"
      SOAK_PROGRESS_INTERVAL_SECS: "${SOAK_PROGRESS_INTERVAL_SECS:-10}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /usr/local/bin/cq-loadgen \
          --server tcp://cqserver:9007 \
          --admin-url http://cqserver:8085 \
          --topic /positions \
          --scenario soak \
          --rate "$$SOAK_RATE" \
          --duration-secs "$$SOAK_DURATION_SECS" \
          --rows "$$SOAK_ROWS" \
          --cols "$$SOAK_COLS" \
          --soak-fast-subscribers "$$SOAK_FAST_SUBSCRIBERS" \
          --soak-conflated-subscribers "$$SOAK_CONFLATED_SUBSCRIBERS" \
          --soak-slow-subscribers "$$SOAK_SLOW_SUBSCRIBERS" \
          --soak-slow-read-delay-ms "$$SOAK_SLOW_READ_DELAY_MS" \
          --soak-progress-interval-secs "$$SOAK_PROGRESS_INTERVAL_SECS"
    restart: "no"

  prometheus:
    container_name: cq-soak-prometheus
    image: prom/prometheus:v2.55.1
    networks:
      cq-soak:
        aliases: [prometheus]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus-soak.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-soak-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      cqserver:
        condition: service_healthy
    restart: unless-stopped

networks:
  cq-soak:
    name: cq-soak
    driver: bridge

volumes:
  cqserver-soak-txlog:
  prometheus-soak-data:
